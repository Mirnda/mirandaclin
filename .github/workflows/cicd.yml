name: CICD

on:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Run lint
        run: golangci-lint run

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run tests
        run: go test -v ./...

  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -o bin/mirandaclin ./cmd/api

      - name: Copy binary to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.APP_KEY }}
          source: "bin/mirandaclin"
          target: "/home/${{ secrets.APP_USER }}/app"

      - name: Configure service and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_NAME: ${{ secrets.APP_NAME }}
          APP_PORT: ${{ secrets.APP_PORT }}
          APP_ENV: ${{ secrets.APP_ENV }}
          APP_HOST: ${{ secrets.APP_HOST }}
          RATE_LIMIT_ENABLED: ${{ secrets.RATE_LIMIT_ENABLED }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          CLIENT_HOSTNAME: ${{ secrets.CLIENT_HOSTNAME }}
          CLIENT_PORT: ${{ secrets.CLIENT_PORT }}
          CLIENT_VERIFY_EMAIL_URL: ${{ secrets.CLIENT_VERIFY_EMAIL_URL }}
          DB_DRIVER: ${{ secrets.DB_DRIVER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSLMODE: ${{ secrets.DB_SSLMODE }}
          REDIS_ADDR: ${{ secrets.REDIS_ADDR }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_DB: ${{ secrets.REDIS_DB }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_JWKS_URL: ${{ secrets.JWT_JWKS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          GRAFANA_USER: ${{ secrets.GRAFANA_USER }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}

        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.APP_KEY }}

          envs: APP_NAME,APP_PORT,APP_ENV,APP_HOST,RATE_LIMIT_ENABLED,CORS_ALLOWED_ORIGINS,CLIENT_HOSTNAME,CLIENT_PORT,CLIENT_VERIFY_EMAIL_URL,DB_DRIVER,DB_HOST,DB_PORT,DB_USER,DB_PASS,DB_NAME,DB_SSLMODE,REDIS_ADDR,REDIS_PASSWORD,REDIS_DB,JWT_ISSUER,JWT_JWKS_URL,JWT_SECRET,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_FROM,GRAFANA_USER,GRAFANA_PASSWORD

          script: |
            cat <<EOF | sudo tee /etc/systemd/system/mirandaclin.service
            [Unit]
            Description=My Go App - MirandaClin
            After=network.target

            [Service]
            Type=simple
            User=${{ secrets.APP_USER }}
            WorkingDirectory=/home/${{ secrets.APP_USER }}/app
            ExecStart=/home/${{ secrets.APP_USER }}/app/mirandaclin
            Restart=always
            RestartSec=2

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo systemctl daemon-reload
            sudo systemctl enable mirandaclin
            sudo systemctl restart mirandaclin