name: CICD

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Run lint
        run: golangci-lint run

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run tests
        run: go test -v ./...

  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    environment:
      name: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -o bin/mirandaclin ./cmd/api

      - name: Create deployment zip
        run: |
          VERSION=$(git rev-parse --short HEAD)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          zip -r mirandaclin-$VERSION.zip bin/ Procfile .platform/ .ebextensions/

      - name: Upload zip to S3
        run: |
          aws s3 cp mirandaclin-${{ env.VERSION }}.zip \
            s3://${{ secrets.EB_S3_BUCKET }}/mirandaclin-${{ env.VERSION }}.zip

      - name: Create Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name mirandaclin \
            --version-label ${{ env.VERSION }} \
            --source-bundle S3Bucket=${{ secrets.EB_S3_BUCKET }},S3Key=mirandaclin-${{ env.VERSION }}.zip

      - name: Sync environment variables
        run: |
          aws elasticbeanstalk update-environment \
            --application-name mirandaclin \
            --environment-name mirandaclin-prod \
            --option-settings \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=APP_ENV,Value=production \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=APP_PORT,Value=8080 \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=RATE_LIMIT_ENABLED,Value=${{ secrets.RATE_LIMIT_ENABLED }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=CORS_ALLOWED_ORIGINS,Value=${{ secrets.CORS_ALLOWED_ORIGINS }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=DB_HOST,Value=${{ secrets.DB_HOST }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=DB_PORT,Value=${{ secrets.DB_PORT }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=DB_USER,Value=${{ secrets.DB_USER }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=DB_PASS,Value=${{ secrets.DB_PASS }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=DB_NAME,Value=${{ secrets.DB_NAME }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=DB_SSLMODE,Value=${{ secrets.DB_SSLMODE }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=REDIS_ADDR,Value=${{ secrets.REDIS_ADDR }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=REDIS_PASSWORD,Value=${{ secrets.REDIS_PASSWORD }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=REDIS_DB,Value=${{ secrets.REDIS_DB }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=JWT_SECRET,Value=${{ secrets.JWT_SECRET }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=JWT_ISSUER,Value=${{ secrets.JWT_ISSUER }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=SMTP_HOST,Value=${{ secrets.SMTP_HOST }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=SMTP_PORT,Value=${{ secrets.SMTP_PORT }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=SMTP_USER,Value=${{ secrets.SMTP_USER }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=SMTP_PASS,Value=${{ secrets.SMTP_PASS }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=SMTP_FROM,Value=${{ secrets.SMTP_FROM }}

      - name: Deploy application version
        run: |
          aws elasticbeanstalk update-environment \
            --application-name mirandaclin \
            --environment-name mirandaclin-prod \
            --version-label ${{ env.VERSION }}

      - name: Wait for deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --application-name mirandaclin \
            --environment-name mirandaclin-prod