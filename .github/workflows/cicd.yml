name: CI/CD

on:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Run lint
        run: golangci-lint run

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Testes unitários
        run: go test -v ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Go Build
        run: go build -o bin/mirandaclin ./cmd/api

  copy to server:
    uses: appleboy/scp-action@v0.1.7
    with:
        host: ${{ secrets.APP_HOST }}
        username: ${{ secrets.APP_USER }}
        password: ${{ secrets.APP_KEY }}
        source: "bin/mirandaclin"
        target: /home/${{ secrets.APP_USER }}/app
  
  Run app:
    uses: appleboy/ssh-action@v1.2.0
    env:
      APP_NAME: ${{secrets.APP_NAME}}
      APP_PORT: ${{secrets.APP_PORT}}
      APP_ENV: ${{secrets.APP_ENV}}
      APP_HOSTNAME: ${{secrets.APP_HOSTNAME}}
      RATE_LIMIT_ENABLED: ${{secrets.RATE_LIMIT_ENABLED}}
      CORS_ALLOWED_ORIGINS: ${{secrets.CORS_ALLOWED_ORIGINS}}
      CLIENT_HOSTNAME: ${{secrets.CLIENT_HOSTNAME}}
      CLIENT_PORT: ${{secrets.CLIENT_PORT}}
      CLIENT_VERIFY_EMAIL_URL: ${{secrets.CLIENT_VERIFY_EMAIL_URL}}
      DB_DRIVER: ${{secrets.DB_DRIVER}}
      DB_HOST: ${{secrets.DB_HOST}}
      DB_PORT: ${{secrets.DB_PORT}}
      DB_USER: ${{secrets.DB_USER}}
      DB_PASS: ${{secrets.DB_PASS}}
      DB_NAME: ${{secrets.DB_NAME}}
      DB_SSLMODE: ${{secrets.DB_SSLMODE}}
      REDIS_ADDR: ${{secrets.REDIS_ADDR}}
      REDIS_PASSWORD: ${{secrets.REDIS_PASSWORD}}
      REDIS_DB: ${{secrets.REDIS_DB}}
      JWT_ISSUER: ${{secrets.JWT_ISSUER}}
      JWT_JWKS_URL: ${{secrets.JWT_JWKS_URL}}
      JWT_SECRET: ${{secrets.JWT_SECRET}}
      SMTP_HOST: ${{secrets.SMTP_HOST}}
      SMTP_PORT: ${{secrets.SMTP_PORT}}
      SMTP_USER: ${{secrets.SMTP_USER}}
      SMTP_PASS: ${{secrets.SMTP_PASS}}
      SMTP_FROM: ${{secrets.SMTP_FROM}}
      GRAFANA_USER: ${{secrets.GRAFANA_USER}}
      GRAFANA_PASSWORD: ${{secrets.GRAFANA_PASSWORD}}
    with:
      host: ${{ secrets.APP_HOST }}
      username: ${{ secrets.APP_USER }}
      password: ${{ secrets.APP_KEY }}
      envs: APP_NAME,APP_PORT,APP_ENV,APP_HOSTNAME,RATE_LIMIT_ENABLED,CORS_ALLOWED_ORIGINS,CLIENT_HOSTNAME,CLIENT_PORT,CLIENT_VERIFY_EMAIL_URL,DB_DRIVER,DB_HOST,DB_PORT,DB_USER,DB_PASS,DB_NAME,DB_SSLMODE,REDIS_ADDR,REDIS_PASSWORD,REDIS_DB,JWT_ISSUER,JWT_JWKS_URL,JWT_SECRET,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_FROM,GRAFANA_USER,GRAFANA_PASSWORD
    script: |
      cat <<EOF | sudo tee /etc/systemd/system/mirandaclin.service
      [Unit]
      Description=My Go App - MirandaClin
      After=network.target

      [Service]
      Type=simple
      User=${{ secrets.APP_USER }}
      WorkingDirectory=/home/${{ secrets.APP_USER }}/app
      ExecStart=/home/${{ secrets.APP_USER }}/app/mirandaclin
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target
      EOF

      sudo systemctl daemon-reload
      sudo systemctl enable myapp
      sudo systemctl restart myapp